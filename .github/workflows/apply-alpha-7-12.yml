name: Aplicar operaciones atómicas alpha.7.12

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar integración y compilar
    if: github.head_ref == 'fix/server-atomic-operations-alpha-7-12' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/server-atomic-operations-alpha-7-12
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Separar workflow protegido
        run: node scripts/fix-alpha-7-12-patcher.mjs
      - name: Comprobar transformador
        run: node --check scripts/apply-alpha-7-12.mjs
      - name: Aplicar integración
        run: |
          node scripts/apply-alpha-7-12.mjs
          rm -f scripts/fix-alpha-7-12-patcher.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run check
      - name: Validar arquitectura atómica
        run: node scripts/validate-atomic-operations.mjs
      - name: Comprobar scripts y hooks
        run: |
          bash -n scripts/test-pocketbase-atomic-operations.sh
          node --check pb_hooks/isivolt_operations.pb.js
          node --check pb_migrations/1722512600_atomic_operations.js
      - name: Compilar aplicación
        run: npm run build
      - name: Retirar artefactos generados
        run: |
          rm -f package-lock.json tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          rm -f public/icons/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/maskable-512.png
      - name: Publicar integración en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(server): operaciones atómicas y reconciliación central"
          git push origin HEAD:fix/server-atomic-operations-alpha-7-12
