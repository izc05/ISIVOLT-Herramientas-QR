name: Aplicar consistencia alpha.7.11

on:
  push:
    branches:
      - fix/data-consistency-alpha-7-11

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar parche y comprobar compilación
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/data-consistency-alpha-7-11
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar script de parche
        run: node --check scripts/apply-data-consistency-alpha-7-11.mjs
      - name: Aplicar parche
        run: node scripts/apply-data-consistency-alpha-7-11.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run check
      - name: Validar consistencia
        run: node scripts/validate-data-consistency.mjs
      - name: Compilar aplicación
        run: npm run build
      - name: Publicar cambios en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(data): transacciones consistentes y sincronización entre pestañas"
          git push origin HEAD:fix/data-consistency-alpha-7-11
