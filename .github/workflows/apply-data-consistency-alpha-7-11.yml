name: Aplicar consistencia alpha.7.11

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    name: Aplicar parche y comprobar compilación
    if: github.head_ref == 'fix/data-consistency-alpha-7-11' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: fix/data-consistency-alpha-7-11
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corregir límites del transformador
        run: node scripts/fix-data-consistency-patcher.mjs
      - name: Comprobar script de parche
        run: node --check scripts/apply-data-consistency-alpha-7-11.mjs
      - name: Aplicar parche
        run: |
          node scripts/apply-data-consistency-alpha-7-11.mjs
          rm -f scripts/fix-data-consistency-patcher.mjs src/data/.gitkeep
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run check
      - name: Validar consistencia
        run: node scripts/validate-data-consistency.mjs
      - name: Compilar aplicación
        run: npm run build
      - name: Retirar artefactos generados
        run: |
          rm -f package-lock.json tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          rm -f public/icons/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/maskable-512.png
      - name: Publicar cambios en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(data): transacciones consistentes y sincronización entre pestañas"
          git push origin HEAD:fix/data-consistency-alpha-7-11
