name: Publicar IsiVoltPro Herramientas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-isivoltpro
  cancel-in-progress: true

jobs:
  build:
    name: Validar y preparar aplicación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobar TypeScript
        run: npm run check

      - name: Compilar producción
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publicar aplicación principal
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
