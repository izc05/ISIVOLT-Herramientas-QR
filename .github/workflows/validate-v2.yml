name: Validar reconstrucción V2

on:
  push:
    branches:
      - rebuild/isivoltpro-herramientas-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript, PWA, PocketBase y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run check
      - name: Validar seguridad del dispositivo
        run: node scripts/validate-device-security.mjs
      - name: Validar modelo de datos V3
        run: node scripts/validate-data-model-v3.mjs
      - name: Validar catálogos y ubicaciones
        run: node scripts/validate-catalogs-locations.mjs
      - name: Validar fichas y fotografías
        run: node scripts/validate-entity-details-photos.mjs
      - name: Validar respuesta premium del escáner
        run: node scripts/validate-scan-feedback.mjs
      - name: Validar recuperación y alta rápida del escáner
        run: node scripts/validate-scan-session-recovery.mjs
      - name: Validar programación NFC
        run: node scripts/validate-nfc-programmer.mjs
      - name: Validar diseñador de etiquetas QR
        run: node scripts/validate-qr-print-designer.mjs
      - name: Validar estado operativo
        run: node scripts/validate-status-overview.mjs
      - name: Validar edición, fotos y versión publicada
        run: node scripts/validate-editing-publication.mjs
      - name: Validar edición en Material y Técnicos
        run: node scripts/validate-main-screen-editing.mjs
      - name: Validar cabecera y branding
        run: node scripts/validate-header-branding.mjs
      - name: Validar consistencia de datos y operaciones
        run: node scripts/validate-data-consistency.mjs
      - name: Validar operaciones atómicas de servidor
        run: node scripts/validate-atomic-operations.mjs
      - name: Validar manifiesto PWA
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('Manifest válido')"
      - name: Validar service worker
        run: node --check public/sw.js
      - name: Validar migraciones y hooks PocketBase
        run: |
          set -euo pipefail
          found=0
          for migration in pb_migrations/*.js; do
            found=1
            echo "Validando $migration"
            node --check "$migration"
          done
          test "$found" -eq 1
          found_hooks=0
          for hook in pb_hooks/*.js; do
            found_hooks=1
            echo "Validando $hook"
            node --check "$hook"
          done
          test "$found_hooks" -eq 1
      - name: Comprobar seguridad PocketBase
        run: node scripts/validate-pocketbase-security.mjs
      - name: Comprobar aislamiento de caché
        run: node scripts/validate-storage-isolation.mjs
      - name: Validar kit de despliegue
        run: |
          set -euo pipefail
          bash -n deploy/pocketbase/install.sh
          bash -n deploy/pocketbase/create-admin.sh
          bash -n deploy/pocketbase/backup.sh
          bash -n deploy/check-deployment.sh
          bash -n scripts/test-pocketbase-integration.sh
          bash -n scripts/test-pocketbase-catalogs.sh
          bash -n scripts/test-pocketbase-atomic-operations.sh
          node scripts/validate-deployment-kit.mjs
      - name: Compilar aplicación e iconos
        run: npm run build
      - name: Comprobar PWA y diagnóstico
        run: node scripts/validate-release-readiness.mjs
      - name: Guardar compilación para revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: isivoltpro-v2-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  pocketbase-integration:
    name: PocketBase real y migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Arrancar PocketBase temporal y probar IsiVoltPro
        env:
          PB_VERSION: 0.39.9
        run: bash scripts/test-pocketbase-integration.sh
      - name: Probar catálogos y ubicaciones con PocketBase real
        env:
          PB_VERSION: 0.39.9
        run: bash scripts/test-pocketbase-catalogs.sh
      - name: Probar concurrencia atómica con PocketBase real
        env:
          PB_VERSION: 0.39.9
        run: bash scripts/test-pocketbase-atomic-operations.sh
