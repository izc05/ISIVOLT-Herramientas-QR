name: Validar reconstrucción V2

on:
  push:
    branches:
      - rebuild/isivoltpro-herramientas-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript, PWA, PocketBase y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npm run check
      - name: Validar manifiesto PWA
        run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('Manifest válido')"
      - name: Validar service worker
        run: node --check public/sw.js
      - name: Validar migraciones PocketBase
        run: |
          set -euo pipefail
          found=0
          for migration in pb_migrations/*.js; do
            found=1
            echo "Validando $migration"
            node --check "$migration"
          done
          test "$found" -eq 1
      - name: Comprobar seguridad PocketBase
        run: node scripts/validate-pocketbase-security.mjs
      - name: Comprobar aislamiento de caché
        run: node scripts/validate-storage-isolation.mjs
      - name: Compilar aplicación
        run: npm run build
      - name: Comprobar archivos PWA compilados
        run: test -f dist/manifest.webmanifest && test -f dist/sw.js && test -f dist/icons/icon.svg
      - name: Guardar compilación para revisión visual
        uses: actions/upload-artifact@v4
        with:
          name: isivoltpro-v2-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
